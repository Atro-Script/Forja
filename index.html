<style>

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif}

.sub{margin:6px 0 0;color:var(--mu);max-width:52ch}
.wrap{max-width:1000px;margin:auto;padding:12px 18px 60px;display:grid;gap:16px}

input[type=color]{width:100%;height:42px;border:1px solid var(--ln);border-radius:5px;background:none;padding:2px}
.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:8px}

button.main{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:500}

canvas:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.msg{min-height:22px;color:var(--mu);font-size:14px;margin:8px 0 0}
#ar{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.aw{border:1px solid var(--ln);border-radius:5px;padding:6px;display:grid;gap:4px}
.aw img{width:100%;border-radius:3px;display:block}
.aw .ld{text-align:left;padding:4px 6px;font-weight:500}
.aw .x{font-size:13px;color:var(--mu);padding:3px 6px}
.empty{color:var(--mu);font-size:15px;margin:0}

.rec{margin-top:10px;border:1px solid var(--ln);border-radius:6px;padding:10px;background:var(--bg)}
.rec h3{font:600 17px Cinzel,Georgia,serif;margin:0 0 4px}
.rec p{margin:0 0 8px;font-size:14px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips button{padding:6px 12px;font-size:14px;border-radius:999px}
.chips button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
#in{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,#2a1204,#0c0704 70%);transition:opacity .7s,visibility .7s;cursor:pointer}
#in.out{opacity:0;visibility:hidden}
#in .ry{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(rgba(255,176,40,.17) 0 4deg,transparent 4deg 15deg);-webkit-mask:radial-gradient(circle,#000,transparent 50%);mask:radial-gradient(circle,#000,transparent 50%);animation:ro 16s linear infinite,fd 1.6s ease-out both}
#in .eo{position:absolute;width:min(46vmin,260px);aspect-ratio:1;border-radius:50%;background:#050302;box-shadow:0 0 0 3px #ffb52e,0 0 40px 8px rgba(255,160,30,.6),0 0 120px 30px rgba(255,120,0,.25);animation:ec 1.4s cubic-bezier(.2,.8,.2,1) both}
#in .tt{position:relative;text-align:center;color:#ffe0a0;font-family:Cinzel,Georgia,serif;animation:fd 1s .9s both;padding:0 16px}
#in .tt small{display:block;font-size:13px;letter-spacing:.3em;text-transform:uppercase;opacity:.8}
#in .tt b{display:block;font-size:clamp(26px,8vw,48px);line-height:1.1;margin-top:6px;text-shadow:0 0 18px #ff8a00;animation:ls 1.6s .9s both}
#in .tt i{display:block;margin-top:14px;font:400 13px Barlow,sans-serif;opacity:.6}
#in::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff3c4,#ff9d2e 40%,transparent 70%);opacity:0;animation:fl .7s 1.1s ease-out}
#in .em{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#ffb52e;box-shadow:0 0 8px #ff8a00;opacity:0;animation:up var(--d) var(--l) linear infinite}
@keyframes ro{to{transform:rotate(360deg)}}
@keyframes fd{from{opacity:0}to{opacity:1}}
@keyframes ec{from{transform:scale(.1);opacity:0}to{transform:none;opacity:1}}
@keyframes ls{from{letter-spacing:.5em}to{letter-spacing:.1em}}
@keyframes fl{0%{opacity:0}30%{opacity:.85}100%{opacity:0}}
@keyframes up{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),-105vh)}}
@keyframes fi{from{opacity:0;transform:scale(.94);filter:brightness(2.2)}to{opacity:1;transform:none;filter:none}}

canvas.fi{animation:fi 1s ease-out}
canvas.fg{animation:fg .9s ease-out}
@media(prefers-reduced-motion:reduce){#in *,#in::after,canvas.fi,canvas.fg{animation:none!important}}
</style>
<style id="movil">
button,select,input,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
@media(pointer:coarse){button,.btns button,.chips button{min-height:44px}input[type=range]{height:34px}input[type=checkbox]{width:22px;height:22px}}

#in{transition:opacity .8s,visibility .8s,transform .8s,filter .8s}

#in .co{position:absolute;width:min(72vmin,420px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,transparent 35%,rgba(255,200,80,.6) 39%,rgba(255,120,20,.28) 52%,transparent 68%);animation:cr 2.2s .5s ease-out both}
@keyframes cr{0%{transform:scale(.3);opacity:0}60%{opacity:1}100%{transform:scale(1.05);opacity:.85}}
#in .tt b .w{display:inline-block;white-space:nowrap}

#in .bar{position:absolute;bottom:calc(8vh + env(safe-area-inset-bottom,0px));width:min(60vw,220px);height:3px;background:rgba(255,200,100,.15);overflow:hidden;border-radius:2px}

@keyframes bar{from{transform:scaleX(0)}to{transform:none}}
@media(prefers-reduced-motion:reduce){#in .tt b .w span{opacity:1!important;transform:none!important}#in .sp{display:none}}
.panel #tlpa button,.panel #tlly button{padding:6px 9px!important;font-size:11px!important;letter-spacing:.05em!important;min-height:36px!important}
#tlpa,#tlly{gap:6px!important}
.tlt{display:flex;gap:6px;margin:0 0 10px}.tlt button{flex:1;padding:10px 4px;min-width:0}.tlt button.on{outline:2px solid #c9a24a;filter:brightness(1.3)}
</style>
</head>
<body>
<div id="in"><div class="ry"></div><div class="eo"></div><div class="tt"><small>The Burning Judgement</small><b>Forja de Juicio Solar</b><i>Toca para entrar</i></div></div>
<header>
<h1>Forja de Juicio Solar</h1>
<p class="sub">The Burning Judgement. Diseña el arma de tu personaje, cambia colores y formas, y descárgala como imagen o animación para el rol.</p>
</header>
<div class="wrap">
<div class="stage">
<canvas id="cv" tabindex="0" aria-label="Vista previa del arma"></canvas>
<div class="btns" style="margin-top:10px"><button id="pv" style="flex:1" aria-label="Arma anterior">‹ Anterior</button><button id="nx" style="flex:1" aria-label="Arma siguiente">Siguiente ›</button></div>
<div class="btns" style="margin-top:8px">
<button class="main" id="png">Descargar imagen</button>
<button class="main" id="vid">Grabar animación (4 s)</button>
<button class="main" id="sw">Probar arma</button><button class="main" id="fc">Descargar ficha</button><button id="sv">Guardar en el arsenal</button>
</div>
<p class="msg" id="msg" role="status"></p>
<div class="panel" id="ft" style="margin-top:10px;line-height:1.6"></div>
</div>
<div>
<div class="panel">
<h2>Arma</h2>
<label for="nm">Nombre</label><input id="nm" type="text" data-k="name" maxlength="28">
<label for="eg">Grabado en el arma (opcional, se ve en el mango o la hoja)</label><input id="eg" type="text" data-k="eng" maxlength="22">
<label for="ab">Habilidad especial</label><input id="ab" type="text" data-k="abil" maxlength="60">
<label for="hi">Historia corta</label><input id="hi" type="text" data-k="story" maxlength="120">
<label for="ra">Rareza</label><select id="ra" data-k="rar"><option value="0">Común</option><option value="1">Forjada</option><option value="2">Eclipsada</option><option value="3">Ceniza Antigua</option></select>
<label for="ty">Forma base (también puedes deslizar el arma en la vista previa)</label>
<select id="ty" data-k="type"><option value="espada">Espada</option><option value="custom">Arma a medida (por piezas)</option><option value="hacha">Hacha</option><option value="lanza">Lanza</option><option value="guadana">Guadaña</option><option value="baculo">Báculo del eclipse</option><option value="daga">Daga</option><option value="katana">Katana</option><option value="martillo">Martillo</option><option value="maza">Maza de púas</option><option value="tridente">Tridente</option><option value="arco">Arco</option><option value="cadena">Cadena del carcelero</option><option value="escudo">Escudo solar</option><option value="solar">Báculo del sol radiante</option><option value="eclipsada">Espada del eclipse</option><option value="hachaeclipse">Hacha del eclipse</option><option value="garras">Guantelete de garras</option><option value="latigo">Espada látigo de espinas</option><option value="retorcida">Lanza retorcida</option><option value="rito">Rito Solar (arma de luz)</option><option value="dagardiente">Daga ardiente</option><option value="rayo">Rayo dorado</option><option value="caramelo">Bastón de caramelo</option><option value="hachadorada">Hacha dorada</option><option value="cuchilla">Cuchilla de carnicero</option><option value="hueso">Garrote de hueso</option><option value="cristal">Daga de cristal</option><option value="piedra">Martillo de piedra</option><option value="estrella">Varita estelar</option><option value="espadarosa">Espada de rosas (vaina de espinas)</option><option value="arcoeclipse">Arco del eclipse</option><option value="sierra">Sierra carmesí</option><option value="cuernos">Espada de cuernos</option><option value="cetro">Cetro de gemas</option><option value="alacuervo">Báculo de ala de cuervo</option><option value="catedral">Espada de catedral</option><option value="dagaeclipse">Daga curva del eclipse</option></select><div id="cp" style="display:none"><label>Arma a medida: elige cada pieza</label><label for="pcb">Hoja</label><select id="pcb" data-k="cb"><option value="recta">Recta</option><option value="curva">Curva</option><option value="ancha">Ancha</option><option value="dentada">Dentada</option><option value="llama">Llameante</option><option value="doble">Doble</option></select><label for="pcg">Guardia</label><select id="pcg" data-k="pg"><option value="cruz">Cruz</option><option value="alada">Alada</option><option value="curva">Curva</option><option value="anillo">Anillo</option><option value="ninguna">Ninguna</option></select><label for="pcm">Empuñadura</label><select id="pcm" data-k="pm"><option value="corto">Corta</option><option value="largo">Larga</option><option value="envuelto">Envuelta</option></select><label for="pcp">Pomo</label><select id="pcp" data-k="pp"><option value="esfera">Esfera</option><option value="gema">Gema</option><option value="pincho">Pincho</option><option value="anillo">Anillo</option></select><button class="main" id="cr" type="button">Piezas al azar</button></div>
<label for="sp">Especialización</label>
<select id="sp" data-k="spec"><option>Incinerador</option><option>Eclipse</option><option>Carcelero</option><option>Errante</option><option>Testigo</option><option>Sepulturero</option><option>Vigía</option><option>Cazador</option></select>
<div class="btns" style="margin-top:8px"><button id="bi">Elegir base ideal</button></div><p class="msg" id="sg"></p>
<div class="rec" id="rc"></div>
</div>
<div class="panel">
<h2>Colores</h2>
<label for="mt">Material (con Metal se usan tus colores; los demás traen su propia paleta, textura y brillo)</label><select id="mt" data-k="mat"><option value="metal">Metal</option><option value="oro">Oro</option><option value="obsidiana">Obsidiana</option><option value="hueso">Hueso</option><option value="cristal">Cristal</option><option value="hielo">Hielo</option></select>
<div class="btns" id="pre" style="margin-bottom:8px"></div>
<div class="cols">
<div><label for="c1">Filo</label><input id="c1" type="color" data-k="c1"></div>
<div><label for="c2">Base</label><input id="c2" type="color" data-k="c2"></div>
<div><label for="cg">Resplandor</label><input id="cg" type="color" data-k="cg"></div>
<div><label for="ch">Mango</label><input id="ch" type="color" data-k="ch"></div>
<div><label for="bg">Fondo</label><input id="bg" type="color" data-k="bg"></div>
</div>
</div>
<div class="panel">
<h2>Forma</h2>
<label for="len">Largo</label><input id="len" type="range" min="0" max="100" data-k="len">
<label for="wid">Ancho</label><input id="wid" type="range" min="0" max="100" data-k="wid">
<label for="cur">Curvatura</label><input id="cur" type="range" min="0" max="100" data-k="cur">
<label for="grd">Guardia y adornos</label><input id="grd" type="range" min="0" max="100" data-k="grd">
<label for="glow">Brillo</label><input id="glow" type="range" min="0" max="100" data-k="glow">
</div>
<div class="panel">
<h2>Emblema</h2>
<label for="es">Forma de la Marca del Eclipse</label><select id="es" data-k="es"><option value="0">Eclipse</option><option value="1">Sol de rayos</option><option value="2">Ojo del juicio</option><option value="3">Sello</option></select>
<label for="ek">Grietas</label><input id="ek" type="range" min="0" max="100" data-k="ek">
<label for="ec">Color</label><input id="ec" type="color" data-k="ec">
</div>
<div class="panel">
<h2>Efectos</h2>
<label class="ck"><input type="checkbox" id="sn" checked> Sonidos</label>
<button id="ins" hidden style="margin:8px 0">Instalar como app</button>
<label for="ql">Calidad de efectos (Bajo ahorra batería y evita tirones en teléfonos modestos)</label><select id="ql"><option value="a">Alto</option><option value="b">Bajo</option></select>
<label for="fx">Ambiente</label>
<select id="fx" data-k="fx"><option value="ambos">Eclipse y brasas</option><option value="anillo">Solo eclipse</option><option value="brasas">Solo brasas</option><option value="ninguno">Ninguno</option></select>
<label class="ck"><input type="checkbox" data-k="mark"> Marca del Eclipse en la imagen</label>
<label class="ck"><input type="checkbox" data-k="transp"> Fondo transparente (solo imagen)</label>
<label class="ck"><input type="checkbox" data-k="jar"> Juicio Ardiente (poder al máximo)</label>
<label for="ly">Lealtad al Contrato de Ceniza (0 = roto: el arma se apaga y se agrieta)</label><input id="ly" type="range" min="0" max="100" data-k="ly">
<div class="btns" style="margin-top:10px"><button id="rnd">Sorpréndeme</button></div>
</div>
<div class="panel">
<h2>Compartir</h2>
<label for="cd">Código del arma (cópialo al grupo, o pega aquí el que te manden)</label><input id="cd" type="text">
<div class="btns" style="margin-top:8px"><button class="main" id="cp">Copiar código</button><button id="ld">Cargar código</button></div>
</div>
<div class="panel">
<h2>Arsenal</h2>
<div class="rec" id="cmp" hidden></div>
<div id="ar"></div>
</div>
</div>
</div>
